version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    # Keep security updates enabled while suppressing routine version PRs.
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Keep security updates enabled while suppressing routine version PRs.
    open-pull-requests-limit: 0
