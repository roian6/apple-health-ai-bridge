name: Feature request
description: Propose a local-first Apple Health bridge improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user need before prescribing an implementation. Proposals that change HealthKit permissions, receiver authentication, pairing, deletion, queue/cursor semantics, networking, hosted behavior, telemetry, or third-party AI paths require a maintainer decision before implementation.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Python CLI or package
        - Receiver or pairing
        - MCP queries
        - iOS app or HealthKit
        - Documentation or setup
        - Release or CI
        - Other
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who needs this, and what workflow would it unlock?
    validations:
      required: true

  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: What should change from the user's perspective?
    validations:
      required: true

  - type: textarea
    id: privacy-impact
    attributes:
      label: Data, privacy, and network impact
      description: Explain affected HealthKit types or local records, new permissions, read-only boundaries, and any network, hosted, telemetry, analytics, advertising, or third-party AI path.
      placeholder: |
        HealthKit types or local records:
        New permission required: yes/no/unknown
        Read-only access preserved: yes/no/unknown
        New network or hosted path: yes/no/unknown
        Telemetry, analytics, advertising, or third-party AI: yes/no/unknown
    validations:
      required: true

  - type: dropdown
    id: app-review-impact
    attributes:
      label: App Review impact
      description: Would this affect privacy copy, App Review notes, screenshots, entitlements, or App Privacy Details? Choose Unsure if you cannot determine the impact.
      options:
        - No known impact
        - May affect App Review
        - Unsure
    validations:
      required: true

  - type: textarea
    id: app-review-details
    attributes:
      label: App Review details
      description: Optional context about possible changes to privacy copy, review notes, screenshots, entitlements, or App Privacy Details.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workaround exists today?
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Privacy and safety confirmation
      options:
        - label: I did not include real HealthKit values, exports, screenshots containing health data, or receiver databases.
          required: true
        - label: I did not include tokens, pairing material, setup-page contents, cursor values, outbox payloads, or private endpoint details.
          required: true
