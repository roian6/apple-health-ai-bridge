name: Release candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed release source SHA
        required: true
        type: string
      tag:
        description: Planned stable Receiver tag
        required: true
        type: string
      tag_object:
        description: Genuine local signed tag object SHA
        required: true
        type: string
      signed_tag_object:
        description: Base64 of exact public signed tag-object bytes
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-candidate-${{ github.run_id }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    name: Qualify frozen release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag_object_sha: ${{ steps.pin.outputs.tag_object_sha }}
      target_commit_sha: ${{ steps.pin.outputs.target_commit_sha }}
      default_main_commit_sha: ${{ steps.pin.outputs.default_main_commit_sha }}
      baseline_commit_sha: ${{ steps.pin.outputs.baseline_commit_sha }}
      baseline_digest: ${{ steps.pin.outputs.baseline_digest }}
    steps:
      - name: Reject dispatch source mismatch before checkout
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/release
          test "$GITHUB_SHA" = "$REQUESTED_SOURCE"
          test "$GITHUB_WORKFLOW_SHA" = "$REQUESTED_SOURCE"
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/release"

      - name: Check out original execution snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Install locked tooling
        run: uv sync --all-extras --dev --locked

      - name: Verify and pin local signed candidate
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
          TAG_OBJECT: ${{ inputs.tag_object }}
          SIGNED_TAG_OBJECT: ${{ inputs.signed_tag_object }}
        run: |
          set -euo pipefail
          uv run python scripts/release_candidate.py --repo . \
            --tag "$RELEASE_TAG" --commit "$REQUESTED_SOURCE" --tag-object "$TAG_OBJECT" \
            --output "$RUNNER_TEMP/candidate.json" --source-output "$RUNNER_TEMP/source.json"
          {
            echo "tag_object_sha=$TAG_OBJECT"
            echo "target_commit_sha=$REQUESTED_SOURCE"
            echo "default_main_commit_sha=$(jq -r '.default_main_commit' "$RUNNER_TEMP/source.json")"
            echo "baseline_commit_sha=$(jq -r '.baseline_commit' "$RUNNER_TEMP/source.json")"
            echo "baseline_digest=$(jq -cS '.baseline' "$RUNNER_TEMP/source.json" | sha256sum | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

  python:
    needs: verify
    name: Verify tag and build Python artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PINNED_TAG_OBJECT_SHA: ${{ needs.verify.outputs.tag_object_sha }}
      PINNED_TARGET_COMMIT_SHA: ${{ needs.verify.outputs.target_commit_sha }}
      PINNED_BASELINE_DIGEST: ${{ needs.verify.outputs.baseline_digest }}
    steps:
      - name: Check out exact tag target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.target_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm pinned target checkout
        run: test "$(git rev-parse HEAD)" = "$PINNED_TARGET_COMMIT_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Import and qualify the same local signed tag
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_TAG_OBJECT: ${{ inputs.signed_tag_object }}
        run: |
          uv run python scripts/release_candidate.py --repo . \
            --tag "$RELEASE_TAG" --commit "$PINNED_TARGET_COMMIT_SHA" \
            --tag-object "$PINNED_TAG_OBJECT_SHA" \
            --output "$RUNNER_TEMP/candidate.json" --source-output "$RUNNER_TEMP/source.json"
          test "$(jq -cS '.baseline' "$RUNNER_TEMP/source.json" | sha256sum | cut -d ' ' -f 1)" = "$PINNED_BASELINE_DIGEST"

      - name: Validate tag and cross-platform versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/release_tools.py validate \
            --repo . \
            --tag "$RELEASE_TAG" \
            --source-receipt "$RUNNER_TEMP/source.json"

      - name: Scan Git history for credentials
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .github/linters/gitleaks.toml --redact --no-banner --log-opts="--all" .

      - name: Install locked dependencies
        run: uv sync --all-extras --dev --locked

      - name: Run exact-tag Python gates
        run: |
          uv run check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
          uv run check-jsonschema --builtin-schema custom.github-workflows-require-timeout .github/workflows/*.yml
          uv run python scripts/public-release-audit.py --strict
          uv run ruff format --check .
          uv run ruff check .
          uv run basedpyright
          uv run bandit -r src -q
          uv run pip-audit --local --skip-editable
          uv run pytest -q

      - name: Build and smoke-test distributions
        run: |
          rm -rf dist
          uv build \
            --build-constraints .github/release/build-constraints.txt \
            --require-hashes \
            --out-dir dist
          rm -f dist/.gitignore
          uv run python scripts/package-smoke.py --dist-dir dist

      - name: Create release metadata and checksums
        run: |
          commit_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse "${commit_sha}^{tree}")"
          tag_object_sha="$PINNED_TAG_OBJECT_SHA"
          uv run python scripts/release_tools.py manifest --candidate \
            --repo . \
            --dist-dir dist \
            --tag "$RELEASE_TAG" \
            --tag-object "$tag_object_sha" \
            --commit "$commit_sha" \
            --tree "$tree_sha" \
            --output dist/release-metadata.json
          cp ".github/release/notes-${RELEASE_TAG}.md" dist/release-notes.md
          uv run python scripts/release_tools.py checksums \
            --repo . \
            --dist-dir dist \
            --tag "$RELEASE_TAG" \
            --tag-object "$tag_object_sha" \
            --commit "$commit_sha" \
            --tree "$tree_sha" \
            --output dist/SHA256SUMS
          (cd dist && sha256sum --check --strict SHA256SUMS)

      - name: Upload exact-tag release packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  ios:
    needs: verify
    name: Verify exact-tag iOS source
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PINNED_TARGET_COMMIT_SHA: ${{ needs.verify.outputs.target_commit_sha }}
    defaults:
      run:
        working-directory: ios/HealthBridgeCompanion
    steps:
      - name: Check out exact tag target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.target_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm pinned target checkout
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "$PINNED_TARGET_COMMIT_SHA"

      - name: Run Swift package tests
        run: swift test

      - name: Build unsigned iPhone simulator app
        run: |
          xcodebuild -project HealthBridgeCompanion.xcodeproj \
            -target HealthBridgeCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned generic iPhone app
        run: |
          xcodebuild -project HealthBridgeCompanion.xcodeproj \
            -target HealthBridgeCompanion \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build


  attest:
    name: Attest immutable candidate artifacts
    needs: [verify, python, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    env:
      PINNED_TAG_OBJECT_SHA: ${{ needs.verify.outputs.tag_object_sha }}
      PINNED_TARGET_COMMIT_SHA: ${{ needs.verify.outputs.target_commit_sha }}
      PINNED_BASELINE_DIGEST: ${{ needs.verify.outputs.baseline_digest }}
    steps:
      - name: Check out original execution snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Install locked tooling
        run: uv sync --all-extras --dev --locked

      - name: Reverify candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_TAG_OBJECT: ${{ inputs.signed_tag_object }}
        run: |
          uv run python scripts/release_candidate.py --repo . \
            --tag "$RELEASE_TAG" --commit "$PINNED_TARGET_COMMIT_SHA" \
            --tag-object "$PINNED_TAG_OBJECT_SHA" \
            --output "$RUNNER_TEMP/candidate.json" --source-output "$RUNNER_TEMP/source.json"
          test "$(jq -cS '.baseline' "$RUNNER_TEMP/source.json" | sha256sum | cut -d ' ' -f 1)" = "$PINNED_BASELINE_DIGEST"

      - name: Download build packet from this execution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Verify exact build packet
        id: packet
        run: |
          set -euo pipefail
          uv run python scripts/release_tools.py verify-packet \
            --repo . --dist-dir dist --tag "$RELEASE_TAG" \
            --tag-object "$PINNED_TAG_OBJECT_SHA" --commit "$PINNED_TARGET_COMMIT_SHA" \
            --tree "$(git rev-parse HEAD^{tree})"
          echo "version=$(uv run python scripts/release_tools.py tag-info --tag "$RELEASE_TAG" | jq -r .version)" >> "$GITHUB_OUTPUT"
          rm dist/SHA256SUMS dist/release-notes.md

      - name: Attest core artifact subjects
        id: build_attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/apple_health_ai_bridge-${{ steps.packet.outputs.version }}-py3-none-any.whl
            dist/apple_health_ai_bridge-${{ steps.packet.outputs.version }}.tar.gz
            dist/release-metadata.json

      - name: Verify and seal candidate packet
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.build_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -ce 'select(type == "object")' "$ATTESTATION_BUNDLE" > dist/receiver-build-provenance.intoto.jsonl
          uv run python scripts/release_candidate.py --phase seal --repo . \
            --record "$RUNNER_TEMP/candidate.json" --dist-dir dist --output dist/candidate.json

      - name: Upload immutable qualified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
