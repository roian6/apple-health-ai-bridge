language: en-US
reviews:
  request_changes_workflow: true
  allow_author_approval: false
  high_level_summary_in_walkthrough: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "^release$"
      - "^(?:fix|feat|docs|chore)/.+$"
  suggested_labels: true
  auto_apply_labels: true
  # Keep one classification policy for PRs and free-form issues.
  labeling_instructions: &classification_labels
    - label: bug
      instructions: >-
        Apply to reported incorrect behavior or a regression. If the item already
        has a valid primary type label, preserve it and do not add a competing type.
        Background discussion of bugs is not itself a bug report.
    - label: enhancement
      instructions: >-
        Apply when the main purpose is a new capability or user-visible improvement.
        If the item already has a valid primary type label, preserve it and do not
        add a competing type.
    - label: documentation
      instructions: >-
        Apply when the principal requested work is documentation. If a feature or
        fix merely includes supporting documentation, use its primary type instead.
        Preserve any existing valid primary type label.
    - label: question
      instructions: >-
        Apply to requests for information or usage help without a requested product
        change. Preserve any existing valid primary type label.
    - label: maintenance
      instructions: >-
        Apply when the main purpose is internal refactoring, tests, dependencies,
        tooling, CI, or repository upkeep rather than a feature or defect fix.
        Preserve any existing valid primary type label.
    - label: "area: ios"
      instructions: >-
        Apply to directly affected iOS app or HealthKit work, including connection
        setup, app-side capability validation, background sync, and iCloud handoff.
        For PRs, use the actual ios/ changes. Incidental mentions do not qualify.
    - label: "area: receiver"
      instructions: >-
        Apply to directly affected receiver, mailbox, macOS helper, pairing,
        ingestion, transport, or receiver capability publication work. Use actual
        changed files on PRs. Do not select from behavior explicitly left unchanged.
    - label: "area: python"
      instructions: >-
        Apply to Python product package, CLI, storage, packaging, or Python-specific
        validation and fuzzing infrastructure, including fuzz/ or scripts/fuzz/.
        Supporting tests or fixtures count only when those responsibilities are
        directly affected. A .py file, a tests/ path, or a Python-written helper
        alone is not sufficient. Exclude brand renderers and governance or
        documentation checks unless Python product or packaging behavior changes.
        Moving an unchanged packaging file without changing package contents or
        build requirements is not sufficient. For issues, do not infer this area
        solely from an implementation language.
    - label: "area: mcp"
      instructions: >-
        Apply to directly affected read-only MCP tools, their query contracts,
        server metadata, or MCP client integration. Mere mentions are insufficient.
    - label: "area: docs"
      instructions: >-
        Apply when documentation or public-facing brand assets are direct work
        items or actual PR changes. Supporting document updates can qualify for
        this area without changing the primary type to documentation. Quoted
        documentation in an otherwise unrelated issue is insufficient.
    - label: "area: ci"
      instructions: >-
        Apply to actual CI workflow, GitHub Actions, release/build automation,
        lint or security-scanning configuration, or review/label automation changes,
        including CodeRabbit configuration. Merely running tests or changing an
        arbitrary helper under scripts/ or tools/ is not sufficient. Exclude a
        brand renderer or its tests when CI or release automation is unchanged.
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: true
    labeling_instructions: *classification_labels
