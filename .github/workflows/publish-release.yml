name: Publish qualified release

on:
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: Release ID returned by staging, including published readback
        required: true
        type: string
      tag:
        description: Genuine public signed Receiver tag
        required: true
        type: string
      candidate_run_id:
        description: Original successful candidate run ID
        required: true
        type: string
      candidate_attempt:
        description: Exact original candidate execution attempt
        required: true
        type: string
      candidate_artifact_id:
        description: Immutable candidate artifact ID
        required: true
        type: string
      helper_sha256:
        description: Qualified native helper archive SHA-256
        required: true
        type: string
      helper_manifest_sha256:
        description: Qualified native helper manifest SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication-${{ github.repository }}
  cancel-in-progress: false

env:
  DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
  RELEASE_TAG: ${{ inputs.tag }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
  CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
  EXPECTED_HELPER_SHA256: ${{ inputs.helper_sha256 }}
  EXPECTED_HELPER_MANIFEST_SHA256: ${{ inputs.helper_manifest_sha256 }}

jobs:
  verify_helper_on_macos:
    name: Verify exact staged helper on clean macOS
    runs-on: macos-15
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Reject wrong tag execution
        run: |
          set -euo pipefail
          [[ "$DRAFT_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^receiver-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@refs/tags/${RELEASE_TAG}"

      - name: Check out original public tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Install locked tooling
        run: uv sync --all-extras --dev --locked

      - name: Download and verify original candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/release_candidate.py --phase download --repo . \
            --run-id "$CANDIDATE_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" --dist-dir dist \
            --output "$RUNNER_TEMP/candidate.json"

      - name: Read back exact staged helper and existing proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/release_recovery.py --phase fetch --repo . \
            --dist-dir dist --candidate-record "$RUNNER_TEMP/candidate.json" \
            --candidate-artifact "$CANDIDATE_ARTIFACT_ID" \
            --release-id "$DRAFT_RELEASE_ID" \
            --helper-sha256 "$EXPECTED_HELPER_SHA256" \
            --helper-manifest-sha256 "$EXPECTED_HELPER_MANIFEST_SHA256"

      - name: Verify native helper distribution and isolated installation
        run: |
          version="${RELEASE_TAG#receiver-v}"
          uv run python scripts/verify_helper_distribution.py \
            --archive "dist/HealthBridgeMailboxAckPublisher-${version}.zip" \
            --manifest "dist/HealthBridgeMailboxAckPublisher-${version}.manifest.json"

  publish:
    name: Reconcile and publish immutable release
    needs: verify_helper_on_macos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-release
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - name: Reject wrong tag execution
        run: |
          set -euo pipefail
          [[ "$DRAFT_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^receiver-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$GITHUB_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/publish-release.yml@refs/tags/${RELEASE_TAG}"

      - name: Check out original public tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Install locked tooling
        run: uv sync --all-extras --dev --locked

      - name: Download and verify original candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/release_candidate.py --phase download --repo . \
            --run-id "$CANDIDATE_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" --dist-dir dist \
            --output "$RUNNER_TEMP/candidate.json"

      - name: Read back exact staged helper and existing proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/release_recovery.py --phase fetch --repo . \
            --dist-dir dist --candidate-record "$RUNNER_TEMP/candidate.json" \
            --candidate-artifact "$CANDIDATE_ARTIFACT_ID" \
            --release-id "$DRAFT_RELEASE_ID" \
            --helper-sha256 "$EXPECTED_HELPER_SHA256" \
            --helper-manifest-sha256 "$EXPECTED_HELPER_MANIFEST_SHA256"

      - name: Reconcile partial or published state before signing
        id: final
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python scripts/release_recovery.py --phase prepare-final --repo . \
            --dist-dir dist --candidate-record "$RUNNER_TEMP/candidate.json" \
            --candidate-artifact "$CANDIDATE_ARTIFACT_ID" \
            --release-id "$DRAFT_RELEASE_ID" \
            --helper-sha256 "$EXPECTED_HELPER_SHA256" \
            --helper-manifest-sha256 "$EXPECTED_HELPER_MANIFEST_SHA256"
          echo "version=${RELEASE_TAG#receiver-v}" >> "$GITHUB_OUTPUT"
          if test -f dist/receiver-final-provenance.intoto.jsonl; then
            echo "attest=false" >> "$GITHUB_OUTPUT"
          else
            echo "attest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest final subjects only when no valid proof exists
        if: steps.final.outputs.attest == 'true'
        id: final_attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/HealthBridgeMailboxAckPublisher-${{ steps.final.outputs.version }}.zip
            dist/HealthBridgeMailboxAckPublisher-${{ steps.final.outputs.version }}.manifest.json
            dist/SHA256SUMS

      - name: Preserve new original final proof
        if: steps.final.outputs.attest == 'true'
        env:
          ATTESTATION_BUNDLE: ${{ steps.final_attestation.outputs.bundle-path }}
        run: |
          test ! -e dist/receiver-final-provenance.intoto.jsonl
          jq -ce 'select(type == "object")' "$ATTESTATION_BUNDLE" > dist/receiver-final-provenance.intoto.jsonl

      - name: Upload missing bytes and publish or verify existing publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/release_recovery.py --phase publish --repo . \
            --dist-dir dist --candidate-record "$RUNNER_TEMP/candidate.json" \
            --candidate-artifact "$CANDIDATE_ARTIFACT_ID" \
            --release-id "$DRAFT_RELEASE_ID" \
            --helper-sha256 "$EXPECTED_HELPER_SHA256" \
            --helper-manifest-sha256 "$EXPECTED_HELPER_MANIFEST_SHA256"
