[project]
name = "apple-health-ai-bridge"
version = "1.1.0"
description = "Open-source receiver and read-only CLI/MCP package for Health Bridge for AI."
keywords = ["ai-agents", "apple-health", "healthkit", "local-first", "mcp"]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    "pydantic>=2.12",
    "segno>=1.6",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://healthbridge.chanhyo.dev/"
Documentation = "https://github.com/roian6/apple-health-ai-bridge/tree/main/docs"
Source = "https://github.com/roian6/apple-health-ai-bridge"
Issues = "https://github.com/roian6/apple-health-ai-bridge/issues"
Releases = "https://github.com/roian6/apple-health-ai-bridge/releases"

[project.scripts]
health-bridge = "health_bridge.cli:run"

[dependency-groups]
dev = [
    "bandit>=1.9",
    "basedpyright>=1.29",
    "check-jsonschema>=0.33",
    "pip-audit>=2.10",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_bridge"]
exclude = [
    "/src/health_bridge/mailbox_m2_validator.py",
    "/src/health_bridge/mailbox_qa/m3_contract.py",
    "/src/health_bridge/mailbox_qa/m3_evidence.py",
    "/src/health_bridge/mailbox_qa/m3_validator.py",
]

[tool.hatch.build.targets.wheel.force-include]
"src/health_bridge/storage/migrations/001_initial.sql" = "health_bridge/storage/migrations/001_initial.sql"
"src/health_bridge/storage/migrations/002_sync_window.sql" = "health_bridge/storage/migrations/002_sync_window.sql"
"src/health_bridge/storage/migrations/003_receiver_tokens.sql" = "health_bridge/storage/migrations/003_receiver_tokens.sql"
"src/health_bridge/storage/migrations/004_pairing_invitations.sql" = "health_bridge/storage/migrations/004_pairing_invitations.sql"
"src/health_bridge/storage/migrations/009_pairing_transport.sql" = "health_bridge/storage/migrations/009_pairing_transport.sql"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.codegraph",
    "/.hermes",
    "/.omo",
    "/.public-release-denylist.local",
    "/.tmp",
    "/src/health_bridge/mailbox_m2_validator.py",
    "/src/health_bridge/mailbox_qa/m3_contract.py",
    "/src/health_bridge/mailbox_qa/m3_evidence.py",
    "/src/health_bridge/mailbox_qa/m3_validator.py",
    "/scripts/validate-mailbox-m3-v1.py",
    "/tests/fixtures/mailbox_m3",
    "/tests/scripts/mailbox_m3_v1_support.py",
    "/tests/scripts/test_mailbox_m3_parent_receipts.py",
    "/tests/scripts/test_mailbox_qa_orchestration.py",
    "/tests/scripts/test_validate_mailbox_m2.py",
    "/tests/scripts/test_validate_mailbox_m3_v1.py",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "ISC001",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"scripts/release_versions.py" = ["INP001"]
"tests/**/*.py" = [
    "D",
    "S101",
    "S105",
    "S106",
    "S310",
    "S603",
    "S607",
    "PLR2004",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
