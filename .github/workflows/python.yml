name: Python CI

on:
  push:
    branches:
      - main
    tags:
      - "ios-v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python quality and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for credentials
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --all-extras --dev --locked

      - name: Verify iOS checkpoint tag
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG_OBJECT_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          event_tag_object_sha="$EVENT_TAG_OBJECT_SHA"
          [[ "$event_tag_object_sha" =~ ^[0-9a-f]{40}$ ]]
          tag_ref_sha="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
            --jq '.object.sha')"
          [[ "$tag_ref_sha" =~ ^[0-9a-f]{40}$ ]]
          tag_object_sha="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{tag}")"
          test "$tag_ref_sha" = "$tag_object_sha"
          test "$tag_ref_sha" = "$event_tag_object_sha"
          signed_tag_name="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            --jq '.tag')"
          test "$signed_tag_name" = "$GITHUB_REF_NAME"
          tag_verified="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            --jq '.verification.verified == true and .verification.reason == "valid"')"
          test "$tag_verified" = "true"
          tag_identity="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            --jq '.tagger.name == "Chanhyo Jung" and (.tagger.email | endswith("@users.noreply.github.com"))')"
          test "$tag_identity" = "true"
          target_sha="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            --jq '.object.sha')"
          target_type="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" \
            --jq '.object.type')"
          test "$target_type" = "commit"
          test "$target_sha" = "$(git rev-parse HEAD)"
          commit_verified="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/commits/${target_sha}" \
            --jq '.commit.verification.verified == true and .commit.verification.reason == "valid"')"
          test "$commit_verified" = "true"
          commit_identity="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/commits/${target_sha}" \
            --jq '.author.login == "roian6" and .committer.login == "web-flow" and .commit.author.name == "Chanhyo Jung" and .commit.committer.name == "GitHub" and .commit.committer.email == ("noreply" + "@" + "github.com")')"
          test "$commit_identity" = "true"
          default_branch="$(gh api \
            "/repos/${GITHUB_REPOSITORY}" \
            --jq '.default_branch')"
          default_main_sha="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/branches/${default_branch}" \
            --jq '.commit.sha')"
          [[ "$default_main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$target_sha" = "$default_main_sha"
          baseline_sha="$(git rev-parse "${target_sha}^1")"
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          uv run python scripts/release_tools.py validate \
            --repo . \
            --tag "$GITHUB_REF_NAME" \
            --tag-target-commit "$target_sha" \
            --default-main-commit "$default_main_sha" \
            --baseline-commit "$baseline_sha"

      - name: Run public release audit
        run: uv run python scripts/public-release-audit.py --strict

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run basedpyright

      - name: Audit Python source
        run: uv run bandit -r src -q

      - name: Audit installed dependencies
        run: uv run pip-audit --local --skip-editable

      - name: Test
        run: uv run pytest -q

      - name: Build distributions
        run: |
          rm -rf dist
          uv build --build-constraints build-constraints.txt --require-hashes --out-dir dist

      - name: Smoke-test built distributions
        run: uv run python scripts/package-smoke.py --dist-dir dist
